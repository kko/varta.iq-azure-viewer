services:
  collector:
    build:
      context: .
      dockerfile: collector/Dockerfile
    image: varta-azure-collector:local
    init: true
    restart: unless-stopped
    ports:
      - "${COLLECTOR_BIND_ADDRESS:-0.0.0.0}:8788:8788"
    environment:
      COLLECTOR_HTTPS: "${COLLECTOR_HTTPS:-false}"
      ALLOWED_HOSTS: "${COLLECTOR_ALLOWED_HOSTS:-localhost:8788,127.0.0.1:8788}"
      COLLECTOR_TLS_HOSTS: "${COLLECTOR_TLS_HOSTS:-localhost,127.0.0.1}"
    volumes:
      - collector-config:/app/config
      - collector-data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  collector-config:
  collector-data:
